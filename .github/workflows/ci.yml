name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # main's branch protection requires this job by name: rename both together.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Installs bun too: it is a devDependency.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
