name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # main's branch protection requires this job by name: rename both together.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
